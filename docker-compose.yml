

 BUILD THE REACT FRONTEND

Use the Node.js 18 Alpine image as the base and name this stage frontend-builder.
Set the working directory to /build.
Copy only the package.json and package-lock.json files from the frontend folder into a frontend subdirectory inside the build folder.
Change into the frontend folder and run npm ci to install all dependencies exactly as locked.
Copy the entire remaining frontend source code into the build folder.
Change into the frontend folder again and run npm run build to create the production-ready static files.
 
 BUILD THE PYTHON BACKEND AND SERVE EVERYTHING

Use the Python 3.10 Slim image as the base for the final stage.
Set the working directory to /app.
Update the package list and install system dependencies like gcc, then clean up the cache to keep the image small.
Copy the requirements.txt file from the backend folder into the current working directory.
Run pip install with the no cache directory flag to install all Python dependencies listed in that file.
Copy the entire backend application code from the backend/app folder into the app folder inside the container.
Copy the built React application from the frontend-builder stage. The static files are located at /build/frontend/build and they are copied into the static folder inside the current working directory.
Create a directory named credentials inside the app folder to hold the Firebase admin SDK JSON file when you mount it later.
Expose port 8000 so the container can accept incoming traffic.
Start the FastAPI server using the uvicorn command, pointing to the main app instance, binding it to all network interfaces on port 8000.

End of Dockerfile content

Important note for your main.py file

You must add a couple of lines to your main Python file so FastAPI knows how to serve your React static files. After you create your app instance, add this line: app.mount("/", StaticFiles(directory="static", html=True), name="static"). Also make sure you import StaticFiles from fastapi.staticfiles at the top of your file.

How to build and run this single file

Open your terminal and navigate to the root folder of your project where the Dockerfile is located. Make sure your environment variables are saved in a file named .env and your Firebase credentials JSON file is placed inside backend/credentials.

To build the image, run this command: docker build -t social-generator .

Once the build finishes, run the container with this command: docker run -d -p 8000:8000 --name social-app --env-file .env -v $(pwd)/backend/credentials:/app/credentials social-generator

After the container starts, open your browser and visit http://localhost:8000. Your React frontend will be served directly from the same port as your FastAPI backend. The interactive API documentation will be available at http://localhost:8000/docs.
